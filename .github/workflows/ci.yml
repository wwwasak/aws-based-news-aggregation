name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run type checking
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test
          LOG_LEVEL: error

      - name: Build all packages
        run: pnpm build

      - name: Setup AWS CDK
        run: npm install -g aws-cdk@2

      - name: CDK Synthesize
        run: |
          cd infra
          npx cdk synth
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: 'us-east-1'

      - name: Upload CDK artifacts
        uses: actions/upload-artifact@v3
        with:
          name: cdk-artifacts
          path: infra/cdk.out/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level moderate

      - name: Check for vulnerabilities
        run: |
          # Check for high/critical vulnerabilities
          if pnpm audit --audit-level high --json | jq -e '.vulnerabilities | length > 0'; then
            echo "High or critical vulnerabilities found!"
            pnpm audit --audit-level high
            exit 1
          fi

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup AWS CDK
        run: npm install -g aws-cdk@2

      - name: CDK Bootstrap (if needed)
        run: |
          cd infra
          npx cdk bootstrap --require-approval never
        env:
          ENVIRONMENT: development

      - name: Deploy to Development
        run: |
          cd infra
          npx cdk deploy --all --require-approval never
        env:
          ENVIRONMENT: development
          LOG_LEVEL: info

      - name: Post-deployment verification
        run: |
          echo "Deployment completed successfully"
          # Add health check or smoke tests here
          # curl -f $API_ENDPOINT/health || exit 1

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-east-1

      - name: Setup AWS CDK
        run: npm install -g aws-cdk@2

      - name: CDK Bootstrap (if needed)
        run: |
          cd infra
          npx cdk bootstrap --require-approval never
        env:
          ENVIRONMENT: production

      - name: Deploy to Production
        run: |
          cd infra
          npx cdk deploy --all --require-approval never
        env:
          ENVIRONMENT: production
          LOG_LEVEL: warn

      - name: Post-deployment verification
        run: |
          echo "Production deployment completed successfully"
          # Add comprehensive health checks here
          # curl -f $PROD_API_ENDPOINT/health || exit 1

      - name: Notify deployment
        if: success()
        run: |
          echo "🚀 Production deployment successful!"
          # Add Slack/Discord notification here

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-prod]
    if: always()
    
    steps:
      - name: Clean up artifacts
        run: |
          echo "Cleaning up temporary artifacts..."
          # Add cleanup logic if needed