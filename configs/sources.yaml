# 新闻源配置
# 支持 RSS 订阅和网页抓取两种类型

# 全局配置
config:
  # 全局请求超时 (毫秒)
  requestTimeout: 30000
  # 用户代理字符串
  userAgent: "NewsAggregator/1.0 (+https://github.com/news-aggregator)"
  # 最大并发数
  maxConcurrency: 5
  # 默认重试次数
  defaultRetries: 3
  # 默认权重
  defaultWeight: 1
  # 默认抓取间隔 (秒)
  defaultInterval: 3600
  # 每个源最大抓取文章数 (新增)
  maxItemsPerSource: 20

# 新闻源列表
sources:
  # 高优先级 RSS 源
  - name: TechCrunch
    type: rss
    url: https://techcrunch.com/feed/
    weight: 2
    intervalSec: 1800  # 30分钟（免费额度优化）
    enabled: true
    description: "Leading technology media property"
    tags: ["tech", "startup", "venture-capital"]
    rateLimit:
      requestsPerMinute: 10
      burstSize: 5

  - name: Wired
    type: rss
    url: https://www.wired.com/feed/rss
    weight: 2
    intervalSec: 1800  # 30分钟（免费额度优化）
    enabled: true
    description: "Technology, science, culture, and business news"
    tags: ["tech", "science", "culture"]
    rateLimit:
      requestsPerMinute: 10
      burstSize: 5

  # 中等优先级 RSS 源
  - name: VentureBeat
    type: rss
    url: https://venturebeat.com/feed/
    weight: 1
    intervalSec: 2400  # 40分钟（免费额度优化）
    enabled: true
    description: "Technology news and analysis"
    tags: ["tech", "business", "ai"]
    rateLimit:
      requestsPerMinute: 8
      burstSize: 3

  - name: Engadget
    type: rss
    url: https://www.engadget.com/rss.xml
    weight: 1
    intervalSec: 2400  # 40分钟（免费额度优化）
    enabled: false  # 暂时禁用以减少抓取量
    description: "Consumer technology news and reviews"
    tags: ["tech", "gadgets", "reviews"]
    rateLimit:
      requestsPerMinute: 8
      burstSize: 3

  - name: Gizmodo
    type: rss
    url: https://gizmodo.com/rss
    weight: 1
    intervalSec: 2400  # 40分钟（免费额度优化）
    enabled: false  # 暂时禁用以减少抓取量
    description: "Design, technology, and science news"
    tags: ["tech", "science", "design"]
    rateLimit:
      requestsPerMinute: 8
      burstSize: 3

  

  # 备用和实验性源 (可选启用)
  - name: Ars Technica
    type: rss
    url: https://feeds.arstechnica.com/arstechnica/index
    weight: 2
    intervalSec: 1200  # 20分钟
    enabled: true  # 默认禁用，可按需启用
    description: "In-depth technology news and analysis"
    tags: ["tech", "analysis", "deep-dive"]
    rateLimit:
      requestsPerMinute: 6
      burstSize: 3

  - name: The Verge
    type: rss
    url: https://www.theverge.com/rss/index.xml
    weight: 2
    intervalSec: 1200  # 20分钟
    enabled: true  # 默认禁用
    description: "Technology, science, art, and culture"
    tags: ["tech", "culture", "reviews"]
    rateLimit:
      requestsPerMinute: 8
      burstSize: 4

  # 国际科技新闻源
  - name: BBC Technology
    type: rss
    url: http://feeds.bbci.co.uk/news/technology/rss.xml
    weight: 1
    intervalSec: 1800  # 30分钟
    enabled: true
    description: "BBC Technology news section"
    tags: ["tech", "international", "bbc"]
    rateLimit:
      requestsPerMinute: 5
      burstSize: 2

  - name: Reuters Technology
    type: rss
    url: https://www.reuters.com/technology/feed/
    weight: 2
    intervalSec: 1800  # 30分钟
    enabled: true
    description: "Reuters Technology news"
    tags: ["tech", "business", "international"]
    rateLimit:
      requestsPerMinute: 6
      burstSize: 3

  # —— 增强覆盖的媒体优先源（少量高价值补强） ——
  - name: Reuters Top News
    type: rss
    url: https://www.reuters.com/rssFeed/topNews
    weight: 3
    intervalSec: 900   # 15分钟，突发优先
    enabled: true
    description: "Global breaking and market-moving headlines"
    tags: ["breaking", "economics", "politics"]
    rateLimit:
      requestsPerMinute: 12
      burstSize: 6

  - name: Reuters Markets
    type: rss
    url: https://www.reuters.com/finance/markets/rss
    weight: 3
    intervalSec: 1200
    enabled: true
    description: "Markets and macroeconomics coverage"
    tags: ["economics"]
    rateLimit:
      requestsPerMinute: 10
      burstSize: 5

  - name: Reuters Politics
    type: rss
    url: https://www.reuters.com/politics/rss
    weight: 2
    intervalSec: 1800
    enabled: true
    description: "US and global politics news"
    tags: ["politics", "policy"]
    rateLimit:
      requestsPerMinute: 8
      burstSize: 4

  - name: AP Top News
    type: rss
    url: https://apnews.com/apf-topnews?output=rss
    weight: 3
    intervalSec: 900
    enabled: true
    description: "Associated Press top and breaking news"
    tags: ["breaking", "politics", "economics"]
    rateLimit:
      requestsPerMinute: 12
      burstSize: 6

  - name: The Hacker News
    type: rss
    url: https://feeds.feedburner.com/TheHackersNews
    weight: 3
    intervalSec: 1800
    enabled: true
    description: "Cybersecurity news and breaches"
    tags: ["security"]
    rateLimit:
      requestsPerMinute: 8
      burstSize: 4

  - name: BleepingComputer
    type: rss
    url: https://www.bleepingcomputer.com/feed/
    weight: 2
    intervalSec: 1800
    enabled: true
    description: "Security incidents, ransomware, vulnerabilities"
    tags: ["security"]
    rateLimit:
      requestsPerMinute: 8
      burstSize: 4

  - name: KrebsOnSecurity
    type: rss
    url: https://krebsonsecurity.com/feed/
    weight: 2
    intervalSec: 2400
    enabled: true
    description: "In-depth security investigations"
    tags: ["security"]
    rateLimit:
      requestsPerMinute: 6
      burstSize: 3

  - name: OpenAI Blog
    type: rss
    url: https://openai.com/blog/rss.xml
    weight: 2
    intervalSec: 1800
    enabled: true
    description: "Official OpenAI updates"
    tags: ["ai", "technology"]
    rateLimit:
      requestsPerMinute: 6
      burstSize: 3

  - name: NVIDIA Blog
    type: rss
    url: https://blogs.nvidia.com/feed/
    weight: 2
    intervalSec: 1800
    enabled: true
    description: "NVIDIA AI and data center updates"
    tags: ["ai", "technology", "bigtech"]
    rateLimit:
      requestsPerMinute: 6
      burstSize: 3

  - name: Apple Newsroom
    type: rss
    url: https://www.apple.com/newsroom/rss-feed.rss
    weight: 2
    intervalSec: 2400
    enabled: true
    description: "Apple official announcements"
    tags: ["bigtech", "technology"]
    rateLimit:
      requestsPerMinute: 6
      burstSize: 3

  - name: Microsoft Blog
    type: rss
    url: https://blogs.microsoft.com/feed/
    weight: 2
    intervalSec: 2400
    enabled: true
    description: "Microsoft official updates"
    tags: ["bigtech", "technology", "ai"]
    rateLimit:
      requestsPerMinute: 6
      burstSize: 3

# 错峰调度配置
scheduling:
  # 启动时的随机延迟范围 (秒)
  initialDelayRange: [0, 300]
  # 错峰调度窗口 (秒) - 在间隔时间基础上的随机偏移
  jitterRange: [-60, 60]
  # 失败重试的退避策略
  backoffStrategy:
    type: "exponential"  # exponential | linear | fixed
    baseDelay: 30        # 基础延迟 (秒)
    maxDelay: 3600       # 最大延迟 (秒)
    multiplier: 2        # 指数退避倍数
    maxRetries: 5        # 最大重试次数

# 监控和日志配置
monitoring:
  # 是否启用详细日志
  verboseLogging: true
  # 性能指标收集
  collectMetrics: true
  # 错误率阈值 (超过此比例将触发告警)
  errorRateThreshold: 0.1
  # 慢请求阈值 (毫秒)
  slowRequestThreshold: 10000

# 健康检查配置
healthCheck:
  # 健康检查间隔 (秒)
  interval: 300
  # 连续失败多少次后标记为不健康
  failureThreshold: 3
  # 不健康源的恢复检查间隔 (秒)
  recoveryInterval: 1800