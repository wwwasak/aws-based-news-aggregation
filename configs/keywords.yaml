# 新闻关键词过滤配置
# 用于评分和标签分类

# 公司列表 - 用于 $company 占位符展开
companies:
  - Apple
  - Microsoft
  - Google
  - Alphabet
  - Amazon
  - AWS
  - Meta
  - Facebook
  - Nvidia
  - OpenAI
  - Tesla
  - Netflix
  - Uber
  - Airbnb
  - Spotify
  - Twitter
  - X

# 主题关键词列表 - 用于 $topic 占位符展开
topics:
  - AI
  - LLM
  - model
  - policy
  - regulation
  - antitrust
  - DOJ
  - FTC
  - "export controls"
  - cloud
  - datacenter
  - layoffs
  - GPU
  - TPU
  - inference
  - training
  - Copilot
  - "Apple Intelligence"
  - ChatGPT
  - GPT
  - "machine learning"
  - "artificial intelligence"
  - blockchain
  - cryptocurrency
  - bitcoin
  - ethereum

# 规则定义
rules:
  # 大科技公司（出现公司名即加分）
  - name: bigtech_general
    description: "涉及大科技公司的任何新闻"
    any:
      - "\\b(?:$company)\\b"
    addTags: [bigtech]
    weight: 2

  # AI 技术与应用
  - name: ai_core
    description: "AI 技术、模型与应用"
    any:
      - "\\b(AI|LLM|model|ChatGPT|GPT|Copilot|machine learning|artificial intelligence|inference|training)\\b"
    addTags: [ai]
    weight: 3

  # 政策与监管（含反垄断/隐私/出口管制等）
  - name: policy_regulation
    description: "政策与监管，包括反垄断、监管机构与合规"
    any:
      - "\\b(policy|regulation|regulatory|law|legal|antitrust|monopoly|competition|compliance)\\b"
      - "\\b(FTC|DOJ|EU|GDPR|CCPA|data protection|export control|sanction|sanctions)\\b"
    addTags: [policy]
    weight: 3

  # 宏观经济（CPI/利率/就业等）
  - name: macro_economics_simple
    description: "宏观经济指标与央行政策"
    any:
      - "\\b(CPI|PPI|nonfarm|unemployment|employment|GDP|inflation|recession|growth)\\b"
      - "\\b(Federal Reserve|Fed|central bank|interest rate|hike|cut|QE|QT|monetary policy)\\b"
    addTags: [economics]
    weight: 3

  # 政治/选举/国会/法院/制裁
  - name: politics_events
    description: "政治事件、选举、立法与重大裁决"
    any:
      - "\\b(election|vote|campaign|primary|debate|ballot|impeachment|court|judge|Supreme Court)\\b"
      - "\\b(congress|senate|house|bill|legislation|appropriation|budget|shutdown)\\b"
      - "\\b(sanction|sanctions|geopolitical|diplomatic|tariff)\\b"
    addTags: [politics]
    weight: 3

  # 突发新闻（高权重）
  - name: breaking_news
    description: "突发新闻标识符"
    any:
      - "^\\s*(BREAKING|URGENT|ALERT|JUST IN|DEVELOPING)"
      - "\\b(breaking|urgent|alert|developing|just in)\\b"
    addTags: [breaking]
    weight: 5

  # 安全事件（泄露/攻击/漏洞）
  - name: security_incidents
    description: "安全事件与数据泄露"
    any:
      - "\\b(data breach|breach|hack|hacked|ransomware|cyber attack|security incident|leak|vulnerability|CVE)\\b"
    addTags: [security]
    weight: 4

  # 科技/产品发布（宽松，弱权重）
  - name: tech_product
    description: "科技产品、发布与通用科技关键词"
    any:
      - "\\b(technology|tech|software|hardware|internet|cloud|datacenter|GPU|TPU|semiconductor|chip)\\b"
      - "\\b(launch|release|unveil|announce|debut|update|version|iPhone|iPad|MacBook|Surface|Pixel|Galaxy|Windows|iOS|Android)\\b"
    addTags: [technology]
    weight: 2

# 评分阈值配置 (更宽松)
scoreThresholds:
  # 大科技公司相关文章的最低分数
  bigtech: 3
  # AI 相关文章的最低分数
  ai: 2
  # 政策相关文章的最低分数  
  policy: 2
  # 经济相关的最低分数
  economics: 2
  # 政治相关的最低分数
  politics: 2
  # 突发新闻的最低分数
  breaking: 4
  # 安全事件的最低分数
  security: 3
  # 科技相关的最低分数
  technology: 2

# 黑名单关键词 (降低分数或排除)
blacklist:
  - advertisement
  - sponsored
  - "ad content"


# 全局配置 (宽松收录)
config:
  # 最低文章分数 (更宽松，低于此分数的文章会被过滤)
  minScore: 1
  # 最高文章分数 (分数上限)
  maxScore: 100
  # 是否启用大小写敏感匹配
  caseSensitive: false
  # 是否启用词边界匹配
  wordBoundary: true
  # 默认权重 (未匹配任何规则时，给予基础分数以便收录更多内容)
  defaultWeight: 2